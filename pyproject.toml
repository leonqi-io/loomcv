[project]
name = "loomcv"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5,<2",
    "jinja2>=3.1.6",
    # Orchestration: the StateGraph with interrupt_before + SqliteSaver
    # checkpoints. langchain-core / langsmith / langgraph-sdk arrive transitively and are never
    # imported by LoomCV; LangSmith tracing stays off (LoomCV sets no tracing variable — do not
    # set one). langgraph-sdk caps websockets < 17 (chromadb's uvicorn[standard] server extra;
    # unused in-process).
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2",
    # PDF export (bundled — no system install): pypandoc-binary carries pandoc
    # 3.9, whose typst writer emits source for a typst version; typst-py compiles; pypdf counts
    # pages. The pandoc / typst pair is pinned together by uv.lock — upgrade them in one change
    # and re-check the PDF export. On Apple silicon the bundled pandoc is x86_64 and needs Rosetta 2 once
    # (`softwareupdate --install-rosetta --agree-to-license`) until pypandoc-binary ships a
    # native arm64 wheel (pypandoc issue #447).
    "pypandoc-binary>=1.17",
    "pypdf>=6",
    "pyyaml>=6",
    "typst>=0.15",
    "rank-bm25>=0.2.2",
    "python-docx>=1.2",
]

[project.scripts]
pipeline = "loomcv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The engine package is `loomcv/`. Declared explicitly because the
# repo root also holds non-package data dirs (`01_raw_assets/`, `99_archive/`, ...)
# that must never be picked up by the wheel build.
[tool.hatch.build.targets.wheel]
packages = ["loomcv"]

# PRIVACY-CRITICAL: hatchling's default sdist sweeps the whole repo,
# which would bundle real STAR evidence (`01_raw_assets/`), `99_archive/`, and internal
# gate docs into a distributable artifact. This is a deliberate ALLOWLIST, not an
# exclude list, so it fails closed: a new private folder is omitted by default and must
# be added here consciously. Everything listed is code, synthetic fixtures, or config.
[tool.hatch.build.targets.sdist]
only-include = ["loomcv", "tests", "config", "README.md"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.4",
]
embed = [
    "sentence-transformers>=6",
]
# The front end (`pipeline ui`). Locked but not installed by a plain `uv sync`,
# like `embed`; `gradio` is imported only inside `loomcv/ui/`. `>=6`: the major `gr.render` was
# checked against (6.30.0).
ui = [
    "gradio>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Formatting/linting is a tool job, not a model job:
# implementers run `uv run ruff format <files>` + `uv run ruff check` before pytest
# instead of hand-fixing whitespace. Keep the rule set small on purpose.
[tool.ruff]
line-length = 100
target-version = "py313"
# "*.md": ruff >= 0.16 formats fenced Python blocks inside Markdown; the planning sketches
# are not code.
extend-exclude = ["99_archive", "01_raw_assets", "02_database", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]
